<text x="304" y="20" text-anchor="middle" style="font-size:12px" fill="#7f849c">Площадь Этерии</text>
<g xml:space="preserve">
<text x="22" y="46"><tspan fill="#89b4fa">===============================================================</tspan></text>
<text x="22" y="65"><tspan fill="#cdd6f4"> </tspan><tspan fill="#f9e2af">Арина</tspan><tspan fill="#cdd6f4"> / </tspan><tspan fill="#cba6f7">Маг</tspan><tspan fill="#cdd6f4">   HP: </tspan><tspan fill="#a6e3a1">[#############-------] 13/20</tspan><tspan fill="#cdd6f4">   До рассвета: </tspan><tspan fill="#89dceb">4 ч.</tspan></text>
<text x="22" y="84"><tspan fill="#cdd6f4"> Локация: </tspan><tspan fill="#89dceb">Площадь Этерии</tspan></text>
<text x="22" y="103"><tspan fill="#89b4fa">===============================================================</tspan></text>
<text x="22" y="122"></text>
<text x="22" y="141"><tspan fill="#cdd6f4">  Куда пойдёте?</tspan></text>
<text x="22" y="160"></text>
<text x="22" y="179"><tspan fill="#cdd6f4">  [1] Таверна «Ржавый якорь» </tspan><tspan fill="#a6e3a1">[выполнено]</tspan></text>
<text x="22" y="198"><tspan fill="#cdd6f4">  [2] Восточный квартал: там кто-то стережёт амулет</tspan></text>
<text x="22" y="217"><tspan fill="#cdd6f4">  [3] Старая библиотека: загадки Хранителя </tspan><tspan fill="#a6e3a1">[выполнено]</tspan></text>
<text x="22" y="236"><tspan fill="#cdd6f4">  [4] Врата Шпиля - туда лучше идти подготовленным</tspan></text>
<text x="22" y="255"><tspan fill="#cdd6f4">  [5] Отдохнуть у фонтана: +6 HP, минус 1 час</tspan></text>
<text x="22" y="274"><tspan fill="#cdd6f4">  [6] Меню: статус и сохранение</tspan></text>
<text x="22" y="293"></text>
<text x="22" y="312"><tspan fill="#cdd6f4">Ваш выбор: 6</tspan></text>
